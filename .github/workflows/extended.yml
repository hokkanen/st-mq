name: Extended validation
on:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'
permissions:
  contents: read
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            peer-node: 24
          - node: 24
            peer-node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.peer-node }}
      - name: Retain the other supported runtime for replication checks
        run: echo "STMQ_OTHER_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build verified SQLite replication tool
        run: |
          node scripts/build-sqlite-rsync.js --output "$RUNNER_TEMP/sqlite-tools/sqlite3_rsync"
          echo "$RUNNER_TEMP/sqlite-tools" >> "$GITHUB_PATH"
      - name: Prepare isolated SSH and MQTT tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server mosquitto
          sudo install -d -m 0755 /run/sshd
      - run: npm run test:extended -- --report=${{ runner.temp }}/extended.jsonl
        env:
          STMQ_REQUIRE_RSYNC_TESTS: '1'
          STMQ_REQUIRE_SSH_TESTS: '1'
          STMQ_REQUIRE_MQTT_TESTS: '1'
          STMQ_REQUIRE_CROSS_RUNTIME_TESTS: '1'
      - name: Retain extended test receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extended-node-${{ matrix.node }}
          path: ${{ runner.temp }}/extended.jsonl
          if-no-files-found: warn
          retention-days: 14
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: st-mq:addon-ci-${{ matrix.arch }}
      - run: bash scripts/test-addon-container.sh st-mq:addon-ci-${{ matrix.arch }} linux/${{ matrix.arch }}
