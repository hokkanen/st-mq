name: Offline validation
on: [push, pull_request]
jobs:
  homeassistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app manifest, translations and options with released Supervisor
        run: bash scripts/test-homeassistant-supervisor.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-secrets.js --history HEAD
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Exercise real process-death recovery boundaries
        run: |
          node scripts/test-offline.js --file test/extended/learning-publication-crash.test.js 180000
          node scripts/test-offline.js --file test/extended/executor-process-recovery.test.js 60000
