name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  homeassistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate app manifest, translations and options with released Supervisor
        run: bash scripts/test-homeassistant-supervisor.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-secrets.js --history HEAD
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run build
      - run: npm test -- --report=${{ runner.temp }}/routine.jsonl
      - name: Retain routine test receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: routine-node-${{ matrix.node }}
          path: ${{ runner.temp }}/routine.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise real process-death recovery boundaries
        run: |
          node scripts/test-offline.js --file test/extended/learning-publication-crash.test.js 180000
          node scripts/test-offline.js --file test/extended/executor-process-recovery.test.js 60000
