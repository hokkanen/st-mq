name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  homeassistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate app manifest, translations and options with released Supervisor
        run: bash scripts/test-homeassistant-supervisor.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-secrets.js --history HEAD
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Protect the test runtime for privileged installer fixtures
        run: |
          stmq_ci_runtime="/opt/stmq-ci-node-${{ matrix.node }}"
          stmq_setup_runtime=$(dirname "$(dirname "$(command -v node)")")
          sudo install -d -o root -g root -m 0755 "$stmq_ci_runtime"
          sudo cp -a "$stmq_setup_runtime/." "$stmq_ci_runtime/"
          sudo chown -R root:root "$stmq_ci_runtime"
          sudo chmod -R go-w "$stmq_ci_runtime"
          echo "$stmq_ci_runtime/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Check privileged installer runtime prerequisites
        run: |
          node scripts/test-offline.js --file test/linux-setup-platform.test.js 60000
          node scripts/test-offline.js --file test/linux-vip-helper.test.js 60000
      - run: npm run check:docs
      - run: npm run build
      - run: npm test -- --report=${{ runner.temp }}/routine.jsonl
      - name: Retain routine test receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: routine-node-${{ matrix.node }}
          path: ${{ runner.temp }}/routine.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise real process-death recovery boundaries
        run: |
          node scripts/test-offline.js --file test/extended/learning-publication-crash.test.js 180000
          node scripts/test-offline.js --file test/extended/executor-process-recovery.test.js 60000
