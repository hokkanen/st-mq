name: Offline validation
on: [push, pull_request]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-secrets.js --history HEAD
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build verified SQLite replication tool
        run: |
          node scripts/build-sqlite-rsync.js --output "$RUNNER_TEMP/sqlite-tools/sqlite3_rsync"
          echo "$RUNNER_TEMP/sqlite-tools" >> "$GITHUB_PATH"
      - name: Prepare isolated SSH tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo install -d -m 0755 /run/sshd
      - run: npm test
        env:
          STMQ_REQUIRE_RSYNC_TESTS: '1'
          STMQ_REQUIRE_SSH_TESTS: '1'
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: st-mq:addon-ci-${{ matrix.arch }}
      - run: bash scripts/test-addon-container.sh st-mq:addon-ci-${{ matrix.arch }} linux/${{ matrix.arch }}
