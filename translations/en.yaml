configuration:
  controller:
    name: Home heating and access
    description: >-
      Start with simulated input and Home heating automation paused. Home
      Assistant ingress grants application admin access through your Home Assistant
      admin login. Home Automatic/Pause, Garage Normal/Away, charging Automatic
      and Caravan Automatic power are independent dashboard controls. Save
      options, then use Data & settings → Check & review configuration → Apply
      reviewed configuration. Input, topology and mirror role changes require
      a restart. Configuration does not grant permission to control equipment.
    fields:
      input:
        name: Input source
        description: >-
          simulated uses synthetic data without device connections; offline
          reads recorded data without device connections. providers uses live
          sensors, prices and weather; mqtt also enables H66 readings when its
          installed device prefix is configured.
      topology:
        name: Computer topology
        description: >-
          standalone runs independently. mirror sends database snapshots over
          SSH from a fixed master to a read-only slave. pair synchronizes two
          computers with explicit manual handover. Neither mode takes over
          automatically. New pairs start with both computers as slaves.
      web_token:
        name: Direct-access admin password
        description: >-
          At least 24 characters. Leave both web passwords empty to disable
          direct access on port 1234 while keeping ingress available. Password
          changes take effect when reviewed configuration is applied.
      web_family_token:
        name: Direct-access family password
        description: >-
          Optional password of at least 24 characters, different from the admin
          password. Requires an admin password. Family can view pages and use
          everyday heating, charging and equipment controls. Configuration,
          database exports and administrative changes require admin access.
      max_drop_c:
        name: Preferred occupied temperature drop (°C)
        description: >-
          Preferred drop of the configured indoor average below its learned normal-heating reference.
          Away periods have no comfort-drop limit. Away and Pause deadlines
          are dashboard controls, not configuration defaults.
      indoor_sensor_weights:
        name: Indoor average weights
        description: >-
          Empty selects configured rooms with Bedroom weighted twice as much as
          Upstairs or Downstairs: 50%, 25%, 25% with all three configured. Set
          nonnegative weights by temperature signal to override. The same average
          is used for the model and all comfort limits; individual rooms have no
          separate limit. Missing sensors never redistribute their weights.
      h66_device:
        name: Installed H66 device prefix
        description: >-
          Exact installed MQTT prefix. Leave empty when H66 is not used. MQTT
          input and the configured broker are required for H66 acquisition.
      h66_verification_file:
        name: Reviewed H66 register verification file
        description: >-
          Optional reviewed installation evidence for register meanings.
          Relative paths are resolved inside this app's /config folder.
      floor_preheat:
        name: Floor preheat installation
        description: >-
          Enable only after commissioning the floor-valve integration.
          Commissioning is installation approval; fresh device evidence and
          active leases are still required for control.
  garage:
    name: Garage heating and doors
    description: >-
      Configure manual Normal/Away heating, the Away target, temperature
      freshness, local frost protection and pump/sender connections. The heat
      pump controller maintains the requested target locally; Garage has no
      automatic price scheduling. Save options, then check and apply reviewed
      configuration in Data & settings.
    fields:
      enabled:
        name: Enable Garage integration
        description: >-
          Enables the configured Garage integration. Commands still require
          fresh adapter evidence; this setting does not confirm local protection.
      awayTargetC:
        name: Away temperature (°C)
        description: >-
          Configured preset for Garage Away. The Normal temperature and selected
          mode are separate durable dashboard choices.
      door_travel_seconds:
        name: Door travel time (seconds)
        description: >-
          Full opening and closing time shared by both doors for the visual
          movement estimate; default 18 seconds, range 1–300. This is not a
          measured position or command confirmation.
      protection:
        name: Local frost protection assumptions
        description: >-
          Installation approval, pipe geometry, margin and heat-transfer
          assumptions applied to the sender. Approve only after review of the
          installation. Actual sender readback determines protection status.
      adapter:
        name: Heat pump MQTT connection
        description: >-
          Exact Shelly CN105 state, telemetry and command topics. The electrical
          source selects native power or counter evidence; none leaves
          electrical telemetry available only for diagnostics.
      sender:
        name: Garage sensor and protection sender
        description: >-
          Exact sender state and command topics, with the maximum accepted age
          of its status. Repeatedly reading a cached value does not renew evidence.
  charging:
    name: Charging defaults, reports and vehicle feeds
    description: >-
      Shared and vehicle-specific defaults set ready-by time, starting charge,
      target charge and usable battery capacity. Session edits stay with the
      current connection. Automatic charging and charger priority are separate
      durable dashboard choices. BMW CarData and TeslaMate provide vehicle
      evidence for either charger.
    fields:
      report_retention_days:
        name: Completed report retention (days)
        description: >-
          Keeps ordinary completed reports for 30 days by default, from 1 to
          3650. Saved reports and active sessions do not expire automatically.
      defaults:
        name: Shared charging defaults
        description: >-
          readyBy is the local ready-by time; manualSoc is starting charge (%),
          minimumSoc is target charge (%) and capacityKwh is usable capacity.
          Session edits do not replace these configuration defaults.
      chargers:
        name: Charger connections
        description: >-
          Charger 1 uses Easee settings. Charger 2 needs explicit enablement,
          MQTT identity and topic. Control readiness comes from live native
          evidence. Optional current limiting also needs reviewed phase/fuse
          settings and compatible numeric control capabilities.
      vehicles:
        name: Vehicle feeds and default overrides
        description: >-
          BMW CarData uses its independent MQTT feed; Tesla uses the TeslaMate
          settings. Vehicle defaults override shared defaults only for that
          vehicle. A feed does not permanently assign a vehicle to a charger.
  electricity:
    name: Electricity rates — c/kWh excluding VAT
    description: >-
      Enter margin, electricity tax and every transfer rate in cents/kWh
      excluding VAT. VAT is added once using vat_percent. Daytime is
      07:00–22:00 Finnish time; seasonal winter daytime is November–March,
      Monday–Saturday, with no holiday exceptions. transfer_tariff selects
      day-night or seasonal. Elapsed price history is preserved.
    fields:
      effective_date:
        name: Rate effective date
        description: >-
          Leave empty to apply changed rates when reviewed configuration is
          applied or the app restarts; first setup begins at today's Finnish
          midnight. YYYY-MM-DD starts at Finnish midnight on that date. Later
          changes must start now or in the future. To cancel a future change,
          restore current rates and clear this date.
  geoloc:
    name: Location for prices and weather
    description: >-
      Country selects the electricity bidding zone. Coordinates select FMI
      temperature and solar forecasts, with Open-Meteo ICON as backup. Neither
      weather service needs an API key. Outdoor temperature prefers the H66
      sensor, then a fresh nearby FMI station reading, then an Open-Meteo model
      estimate. Keep precise coordinates in private installation configuration.
  mqtt:
    name: MQTT broker and temperature sensors
    description: >-
      Configure the broker address and credentials explicitly. The default
      core-mosquitto host names Home Assistant's Mosquitto app; this application does not
      discover broker credentials. Equipment devices specify exact MQTT topics.
      Providers input can use MQTT sensors without H66. Manual commands and
      each subsystem's automatic-control permission remain separate.
    fields:
      address:
        name: Broker URL
        description: >-
          Use mqtt:// or mqtts:// followed by the broker address and optional
          port. Both computers in a pair need their own local broker. When
          copying Ubuntu configuration to Home Assistant for pair mode, use
          mqtt://core-mosquitto for the Mosquitto app, with its credentials
          below. The controller must not use the shared virtual IP.
      user:
        name: Broker username
        description: >-
          Credentials must work with this computer's primary broker. When
          copying from Ubuntu, use the Home Assistant Mosquitto account;
          matching accounts on both brokers can use the same credentials.
      pw:
        name: Broker password
        description: >-
          Password for the primary broker account above. Broker credentials
          are separate from the shared pairing token.
      ha:
        name: Separate Home Assistant broker
        description: >-
          Ubuntu can use this connection for HA-hosted integrations. On HA,
          when the primary broker is already core-mosquitto, set address,
          user and pw all to empty strings. Omitting these fields or importing
          an empty object keeps any saved values; clearing only the address
          while leaving credentials is invalid.
      temperature_report_interval_minutes:
        name: Expected temperature report interval (minutes)
        description: >-
          Maximum expected interval between genuine indoor sensor reports;
          default 70 minutes. Zero disables this deadline for publishers that
          report only changes; other freshness checks still apply.
      temperature_report_grace_seconds:
        name: Temperature report grace (seconds)
        description: >-
          Extra allowance after the expected report interval; default 300
          seconds. Match the interval and grace to the actual publisher.
  entsoe:
    name: ENTSO-E electricity prices
    description: >-
      ENTSO-E is the primary price source; configure its API token here. Direct
      Elering prices are the backup and need no API key for FI, EE, LV and LT.
      Optional domain overrides the country-derived bidding zone. Elering only
      substitutes prices from that same zone.
  easee:
    name: Easee charger and Equalizer
    description: >-
      Configure user/password and device IDs for Easee readings and Charger 1.
      Leave unused device IDs empty. Renewed login tokens are cached privately;
      Supervisor options are not rewritten. Charging Automatic is a separate
      dashboard choice, initially off. With Automatic enabled, a fresh physical
      connection can take over earlier native charging instructions after
      confirmation; later external instructions retain priority. Use automatic
      explicitly requests renewed control for the current connection.
    fields:
      charger_voltage_ids:
        name: Verified phase voltage observation IDs
        description: >-
          Optional three verified phase-to-neutral observation IDs. Leave empty
          to allocate by currents. Use [194, 195, 196] only after verifying the
          documented TN terminal mapping for the installed charger.
      local_ocpp:
        name: Native local OCPP connection
        description: >-
          Local OCPP is enabled by default and needs a charger-reachable
          endpoint and reviewed native setup. Leave server_url empty to use
          the detected address, or the shared virtual IP in pair mode. Host networking uses the
          configured listener port directly, normally 9001. Ingress does not
          carry OCPP. Authorization and charger safety restrictions remain
          active. Restarting this application preserves the current native connection.
  teslamate:
    name: TeslaMate vehicle evidence
    description: >-
      Read TeslaMate MQTT vehicle evidence through the configured broker.
      carId selects the TeslaMate vehicle; homeGeofence must match TeslaMate's
      home geofence name. namespace is its optional TeslaMate MQTT namespace.
      maxAgeMs limits evidence freshness. This feed does not grant authority
      to start charging or assign a vehicle without fresh connection evidence.
  equipment:
    name: Equipment inventory and MQTT connections
    description: >-
      Define sensors, switches, meters, doors and Caravan equipment with exact
      MQTT or Shelly connections. Standard defaults use generic equipment topics.
      Overriding devices replaces the entire inventory, not one entry. Device
      identity, supported capabilities and fresh observations determine which
      controls are available. Polling cached readings does not renew freshness.
    fields:
      devices:
        name: Complete equipment inventory
        description: >-
          Each device has a stable id, area, kind and connection. Configure
          signal/readings and MQTT paths for its actual payload. Explicit
          control flags describe wiring and capabilities. Caravan automatic
          power and its thresholds are independent dashboard choices.
  acquisition:
    name: Provider acquisition intervals
    description: >-
      Default intervals are 15 seconds for Easee, 5 minutes for outdoor weather,
      30 minutes for forecasts and 60 minutes for prices. Missing next-day
      prices are retried every 15 minutes. Source timestamps determine
      freshness. electricity_source_max_age_seconds limits held power
      estimates; electricity_max_gap_seconds limits integration across gaps;
      electricity_telemetry_max_age_seconds limits electrical telemetry age.
  recording:
    name: Historical recording and exports
    description: >-
      annual_budget_gb is a soft rolling database-growth target in decimal
      GB/year, default 10. The recorder adjusts continuous measurement
      thresholds. States and settings retain exact changes; source outages
      remain missing. This target is not a calendar-year quota or history
      retention policy.
    fields:
      export_directory:
        name: Server export directory
        description: >-
          Destination for Save local copy in Export database. In Home Assistant,
          use a persistent path such as /share/st-mq/exports or
          /config/st-mq/exports. The shared default ~ is the server account's
          home inside the container and does not survive image replacement.
          Download database instead saves through the browser.
  pair:
    name: Paired computers with manual takeover
    description: >-
      Used with controller.topology pair. Configure a shared pair_id and private
      token, the other computer's fixed HTTP peer_url, and virtual IP settings.
      Peer payloads are encrypted. Each computer needs its own local broker and
      installation settings. The master controls equipment; the slave remains
      read-only until an explicit handover or promotion. New pairs start with
      two slaves; manually promote one first. Saved pair state governs later
      roles. Host networking uses port directly, normally 1244. The app requests
      NET_ADMIN and NET_RAW capabilities for virtual IP management. Copying
      Ubuntu configuration to HA for pair mode? Review mqtt.address and its
      credentials, mqtt.ha, peer_url, listen_host, vip_interface, vip_socket and
      local paths below before saving. Keep the pair ID, token and virtual IP
      settings the same. Imports merge into saved options; omitted fields keep
      their saved values. Pair changes require a restart.
    fields:
      peer_url:
        name: Other computer's fixed address
        description: >-
          On Home Assistant, use http:// followed by Ubuntu's fixed address
          and peer port, normally 1244. A copied Ubuntu configuration points
          to HA and must be changed. Do not use this computer's address or
          the shared virtual IP.
      listen_host:
        name: Local peer listener address
        description: >-
          Use 0.0.0.0 to listen on local interfaces, or this Home Assistant
          computer's fixed address for a specific binding. Do not copy an
          Ubuntu-specific address here.
      directory:
        name: Private pair state directory
        description: >-
          Leave empty to use /data/st-mq/pairing in Home Assistant. Contains
          local pair state and work, separate from received snapshots. When
          copying from Ubuntu, preserve HA's existing path; changing it can
          select different saved authority and history.
      snapshot_directory:
        name: Received snapshot directory
        description: >-
          Leave empty to use /config/st-mq/pair-snapshots in Home Assistant.
          stale_seconds marks old snapshots stale. Pair has its own
          synchronization and does not use mirror settings. Preserve HA's
          existing path when copying Ubuntu configuration; use the default
          only for a new installation or an intentional storage change.
      vip_interface:
        name: Local LAN interface
        description: >-
          Use this computer's LAN interface name. The other paired computer
          may use a different name. Check HA's actual interface before copying
          a value from Ubuntu. After changing it, restart the app to regenerate
          its virtual-IP helper policy.
      vip_address:
        name: Shared MQTT virtual IP
        description: >-
          Use the same reserved, unused LAN IPv4 address on both computers,
          outside the DHCP allocation range. MQTT devices use this address;
          this app connects to its local broker. Restart after changing it.
      vip_socket:
        name: Address-helper socket
        description: >-
          Set to an empty string in Home Assistant to use the bundled helper
          directly. Standalone Linux uses /run/st-mq-vip/socket. Omitting this
          field from an import does not clear an already saved Ubuntu path.
  mirror:
    name: Database mirroring over SSH
    description: >-
      Used with controller.topology mirror on both computers. Set role master
      on the sender and slave on the receiver. The master sends SQLite
      snapshots over SSH using ssh_host, remote_directory and receiver_path.
      ssh_config optionally selects an absolute SSH configuration path.
      The slave displays snapshots without equipment connections or takeover.
      Role changes require restart. Select standalone or pair to stop mirroring.
    fields:
      directory:
        name: Local mirror directory
        description: >-
          Leave empty to use mirror inside the database directory, normally
          /config/st-mq/mirror in Home Assistant. stale_seconds marks old
          snapshots stale; interval_seconds and timeout_seconds apply to the master.
