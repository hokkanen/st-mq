configuration:
  controller:
    name: Home controller
    description: >-
      Start with simulated input and shadow mode. Home Assistant ingress uses
      your HA login. Leave web_token empty to keep direct port 1234 disabled, or
      set a private token of at least 24 characters to enable direct access.
      Save options, then choose Apply configuration in ST-MQ. Token changes apply
      immediately; clearing the token disables direct access while ingress stays
      available. Input changes require restarting the add-on. Providers input reads online
      sensors, electricity prices and weather. MQTT input adds read-only H66
      readings and needs the exact installed H66 device prefix. An optional
      reviewed h66_verification_file confirms installed register meanings;
      relative paths are inside this add-on's SSH-accessible /config folder.
      Active mode operates the selected supported control transport.
      max_drop_c is the preferred occupied
      temperature drop in °C (default 1); away periods have no comfort-drop
      limit. The comfort reference is learned from continuous normal heating.
      Away until and Pause until are temporary dashboard controls.
  electricity:
    name: Electricity rates — c/kWh EXCLUDING VAT
    description: >-
      Enter every monetary value in cents/kWh excluding VAT, including margin,
      electricity tax and all transfer rates. VAT is added once using vat_percent
      (default 25.5). Defaults are margin 0.33 (0.41415 including VAT) and tax
      2.325 (2.917875 including VAT). Default day/night transfer rates correspond
      to 3.34/1.96 including VAT. Seasonal winter-day/other rates correspond to
      4.17/2.07 including VAT. Daytime is 07:00–22:00 Finnish time; seasonal
      winter daytime is November–March, Monday–Saturday, with no holiday
      exceptions. transfer_tariff selects day-night or seasonal. Leave
      effective_date empty to apply changed rates with Apply configuration or at restart; first setup
      begins at today's Finnish midnight. An explicit YYYY-MM-DD date starts
      at Finnish midnight. Later rate changes apply now or in the future;
      elapsed history is preserved. A future configured change can be edited
      before it starts. To cancel it, restore the current rates and clear the
      effective date. Previous rate snapshots remain available for history.
  geoloc:
    name: Location for prices and weather
    description: >-
      The country code selects ENTSO-E and Elering electricity prices.
      Coordinates select FMI temperature and solar radiation forecasts, with
      Open-Meteo ICON as backup. Neither weather service needs an API key.
      Current outdoor temperature uses the H66 sensor first, then a fresh FMI
      nearby station reading, then an Open-Meteo model estimate.
  mqtt:
    name: MQTT broker and temperature sensors
    description: >-
      MQTT input subscribes to the installed H66 using this broker address,
      username and password. Shadow and monitoring modes observe; active mode
      can operate supported equipment. Set indoor_temperature_topic and
      garage_temperature_topic to exact MQTT topics for replacement temperature
      sensors. Providers input can use these topics without an H66 device.
      Indoor topics expect a genuine report every 15 minutes, allowing 120 seconds
      of delay. Change temperature_report_interval_minutes and
      temperature_report_grace_seconds to match the publisher; interval 0 disables
      the deadline for sensors that report only changes.
  entsoe:
    name: ENTSO-E API token (recommended)
    description: >-
      ENTSO-E is the primary electricity price source. Direct Elering prices
      are the backup and need no API key; supported countries are FI, EE, LV
      and LT. The optional domain overrides the country-derived bidding zone;
      omit it to use country_code. Elering only substitutes the same zone.
  easee:
    name: Easee consumption readings (optional)
    description: >-
      Provide device IDs and either user/password or access_token/refresh_token
      to collect charger and Equalizer readings. Leave device IDs empty when
      unused. Readings are read-only; token renewals are cached privately and
      options.json is not rewritten. Stale measurements remain marked stale. charger_voltage_ids may contain three verified phase-to-neutral observation IDs; leave empty to allocate by currents. Use [194, 195, 196] only after verifying the charger uses the documented TN terminal mapping. Cumulative kWh is diagnostic-only and never corrects or trains the model.
  recording:
    name: Historical recording
    description: >-
      max_interval_minutes is the maximum interval between fresh-data records
      (default 5). annual_budget_gb is a soft rolling database-growth target in
      decimal GB/year (default 10), not a calendar-year quota. The independent
      recorder automatically adjusts a shared normalized accuracy target.
      Source outages remain missing; no timer creates new measurements.
  acquisition:
    name: Provider acquisition intervals
    description: >-
      Easee polls every 15 seconds by default; outdoor weather every 5 minutes,
      forecasts every 30 minutes and prices hourly. Missing next-day prices
      are checked every 15 minutes. Source timestamps determine freshness.
      electricity_source_max_age_seconds limits holding an old power estimate;
      electricity_max_gap_seconds bounds integration across acquisition gaps.
