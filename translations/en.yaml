configuration:
  controller:
    name: Home controller
    description: >-
      Start with simulated input and shadow mode. Home Assistant ingress grants
      admin access through your HA login. topology selects standalone, mirror or
      pair. Standalone runs independently as master. Mirror uses
      SSH to send snapshots from a master to a read-only slave; roles are fixed
      by mirror.role. Pair uses the peer connection for synchronization and
      manual handover. Both new pair computers start as slaves; manually promote
      one to become the first master. Saved pair state determines later roles.
      Neither mirror nor pair takes over automatically. Topology and mirror.role
      configuration changes require a restart.
      Leave web_token and web_family_token
      empty to keep direct port 1234 disabled, or set web_token to an admin
      password of at least 24 characters. Optionally set web_family_token to a
      different password of at least 24 characters for family access. Family can
      view all pages and operate firewood, DHWR, temporary heating, Away/Pause,
      garage doors and EV card controls. Other writes, exports and downloads
      require admin. Save options, then choose Apply configuration in the
      application. Password changes apply immediately; clearing both passwords
      disables direct access while ingress stays
      available. Input changes require restarting the add-on. Providers input reads online
      sensors, electricity prices and weather. MQTT input adds read-only H66
      readings and needs the exact installed H66 device prefix. An optional
      reviewed h66_verification_file confirms installed register meanings;
      relative paths are inside this add-on's SSH-accessible /config folder.
      Active mode operates the selected supported control transport.
      max_drop_c is the preferred occupied
      temperature drop in °C (default 1.5); away periods have no comfort-drop
      limit. The comfort reference is learned from continuous normal heating.
      Away until and Pause until are temporary dashboard controls.
  electricity:
    name: Electricity rates — c/kWh EXCLUDING VAT
    description: >-
      Enter every monetary value in cents/kWh excluding VAT, including margin,
      electricity tax and all transfer rates. VAT is added once using vat_percent
      (default 25.5). Defaults are margin 0.33 (0.41415 including VAT) and tax
      2.325 (2.917875 including VAT). Default day/night transfer rates correspond
      to 3.34/1.96 including VAT. Seasonal winter-day/other rates correspond to
      4.17/2.07 including VAT. Daytime is 07:00–22:00 Finnish time; seasonal
      winter daytime is November–March, Monday–Saturday, with no holiday
      exceptions. transfer_tariff selects day-night or seasonal. Leave
      effective_date empty to apply changed rates with Apply configuration or at restart; first setup
      begins at today's Finnish midnight. An explicit YYYY-MM-DD date starts
      at Finnish midnight. Later rate changes apply now or in the future;
      elapsed history is preserved. A future configured change can be edited
      before it starts. To cancel it, restore the current rates and clear the
      effective date. Previous rate snapshots remain available for history.
  geoloc:
    name: Location for prices and weather
    description: >-
      The country code selects ENTSO-E and Elering electricity prices.
      Coordinates select FMI temperature and solar radiation forecasts, with
      Open-Meteo ICON as backup. Neither weather service needs an API key.
      Current outdoor temperature uses the H66 sensor first, then a fresh FMI
      nearby station reading, then an Open-Meteo model estimate.
  mqtt:
    name: MQTT broker and temperature sensors
    description: >-
      MQTT input subscribes to the installed H66 using this broker address,
      username and password. Shadow and monitoring modes observe; active mode
      can operate supported equipment. Set indoor_temperature_topic and
      garage_temperature_topic to exact MQTT topics for replacement temperature
      sensors. Providers input can use these topics without an H66 device.
      Indoor topics expect a genuine report every 70 minutes, allowing 300 seconds
      of delay. Change temperature_report_interval_minutes and
      temperature_report_grace_seconds to match the publisher; interval 0 disables
      the deadline for sensors that report only changes.
  entsoe:
    name: ENTSO-E API token (recommended)
    description: >-
      ENTSO-E is the primary electricity price source. Direct Elering prices
      are the backup and need no API key; supported countries are FI, EE, LV
      and LT. The optional domain overrides the country-derived bidding zone;
      omit it to use country_code. Elering only substitutes the same zone.
  easee:
    name: Easee consumption readings (optional)
    description: >-
      Provide device IDs and either user/password or access_token/refresh_token
      to collect charger and Equalizer readings. Leave device IDs empty when
      unused. Token renewals are cached privately and options.json is not rewritten.
      Separately enabling Automatic charging on Charger 1 permits native Easee
      schedules, independently of heating mode; it is off by default.
      Stale measurements remain marked stale. charger_voltage_ids may contain three verified phase-to-neutral observation IDs; leave empty to allocate by currents. Use [194, 195, 196] only after verifying the charger uses the documented TN terminal mapping. Cumulative kWh is diagnostic-only and never corrects or trains the model.
  charging:
    name: Charger vehicle feeds and efficiency
    description: >-
      Each charger can use a distinct exact mqttTopic for vehicle charge readings.
      Leave the topic empty to disable that extra feed. Defaults are
      stmq/garage/charger1/vehicle for Charger 1 and no extra feed for Charger 2.
      efficiency is the battery share of grid energy, from 0.5 to 1, default 0.9.
      Apply configuration reloads these deployment settings. Automatic charging,
      target charge, ready-by time and manual fallbacks are saved separately in
      each dashboard charger card. Charger 2 currently has no command adapter.
  recording:
    name: Historical recording
    description: >-
      annual_budget_gb is a soft rolling database-growth target in
      decimal GB/year (default 10), not a calendar-year quota. The independent
      recorder adjusts continuous measurement thresholds. States and settings
      retain exact changes; unchanged values have no forced recording interval.
      Source outages remain missing; no timer creates new measurements.
  acquisition:
    name: Provider acquisition intervals
    description: >-
      Easee polls every 15 seconds by default; outdoor weather every 5 minutes,
      forecasts every 30 minutes and prices hourly. Missing next-day prices
      are checked every 15 minutes. Source timestamps determine freshness.
      electricity_source_max_age_seconds limits holding an old power estimate;
      electricity_max_gap_seconds bounds integration across acquisition gaps.
  mirror:
    name: Database mirroring over SSH
    description: >-
      Used when controller.topology is mirror on both computers. The master
      sends snapshots using sqlite3_rsync over SSH. Set mirror.role to master
      on the sender and slave on the receiver. Configure ssh_host,
      remote_directory and receiver_path there. ssh_config optionally selects
      an absolute SSH configuration path. The slave displays received snapshots
      without connecting to equipment and has no takeover workflow. Its
      directory defaults to mirror inside the database directory. stale_seconds
      marks old snapshots as stale. interval_seconds and timeout_seconds apply
      to the master. Select standalone or pair in controller.topology to stop
      SSH mirroring; there is no separate enable flag.
  pair:
    name: Paired computers with manual takeover
    description: >-
      Used when controller.topology is pair on both computers. Configure a shared
      pair_id and private token, the other computer's fixed HTTP peer_url, and
      the shared virtual IP settings. Peer messages and snapshots are encrypted.
      Both computers need their own local MQTT broker and controller settings.
      The master controls equipment; the slave keeps a read-only standby ready
      for manual handover or promotion. It never takes over automatically.
      Both new computers start as slaves. Manually promote one to initialize the
      first master; saved pair state governs later roles across restarts. Pair
      roles are not configuration settings. directory stores local pair state
      and work, defaulting to pairing in
      the data directory. snapshot_directory stores received snapshots,
      defaulting to pair-snapshots in the database directory. stale_seconds
      marks old snapshots as stale. Pair mode has its own synchronization and
      uses its own snapshot settings. There is no separate enable flag.
